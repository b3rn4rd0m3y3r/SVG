<p>Polygon</p>
<svg width="300" height="150" style="border:1px solid black">
  <polygon points="150,20 220,120 80,120" fill="orange" />
</svg>

<p>Polygon e Polyline</p>
<svg width="300" height="150" style="border:1px solid black">
  <polyline points="20,120 70,30 120,120" fill="none" stroke="red" stroke-width="3" />
  <polygon points="170,120 220,30 270,120" fill="none" stroke="blue" stroke-width="3" />
</svg>

<p>Formas</p>
<svg width="300" height="150" style="border:1px solid black">
  <!-- losango -->
  <polygon points="50,20 90,75 50,130 10,75" fill="tomato" />
  <!-- pentágono -->
  <polygon points="150,15 195,50 178,110 122,110 105,50" fill="seagreen" />
  <!-- seta -->
  <polygon points="220,60 260,60 260,40 290,75 260,110 260,90 220,90" fill="royalblue" />
</svg>

<p>Contorno e junções</p>
<svg width="300" height="150" style="border:1px solid black">
  <polygon points="150,20 220,120 80,120" fill="gold" stroke="darkorange" stroke-width="8" stroke-linejoin="round" />
</svg>

<p>Star</p>
<svg width="300" height="150" style="border:1px solid black">
  <polygon points="75,10 92,58 143,58 102,88 117,138 75,108 33,138 48,88 7,58 58,58" fill="gold" stroke="black" stroke-width="2" />
  <polygon points="225,10 242,58 293,58 252,88 267,138 225,108 183,138 198,88 157,58 208,58" fill="gold" stroke="black" stroke-width="2" fill-rule="evenodd" />
</svg>
