<p>Estilo e Organização</p>
<svg width="300" height="150" style="border:1px solid black">
  <rect x="0" y="0" width="60" height="40" fill="lightgray" />
  <rect x="0" y="0" width="60" height="40" fill="tomato" transform="translate(80, 50)" />
  <rect x="0" y="0" width="60" height="40" fill="green"  transform="translate(150, 90)" />
</svg>

<p>Rotate</p>
<svg width="300" height="150" style="border:1px solid black">
  <!-- original em cinza -->
  <rect x="20"  y="10" width="60" height="30" fill="lightgray" />
  <rect x="150" y="50" width="80" height="50" fill="lightgray" />

  <!-- gira em torno da origem (0,0) -->
  <rect x="20" y="10" width="60" height="30" fill="tomato" transform="rotate(10)" />

  <!-- gira em torno do centro da própria forma -->
  <rect x="150" y="50" width="80" height="50" fill="royalblue" transform="rotate(10, 90, 90)" />
</svg>
