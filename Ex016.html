<p>Linear Gradient</p>
<svg width="300" height="150" style="border:1px solid black">
  <defs>
    <linearGradient id="pordosol">
      <stop offset="0%"   stop-color="gold" />
      <stop offset="100%" stop-color="tomato" />
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="260" height="110" fill="url(#pordosol)" />
</svg>

<p>Com paradas</p>
<svg width="300" height="150" style="border:1px solid black">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="midnightblue" />
      <stop offset="60%"  stop-color="orchid" />
      <stop offset="100%" stop-color="gold" />
    </linearGradient>
  </defs>
  <rect width="300" height="150" fill="url(#ceu)" />
</svg>

<p>Radial</p>
<svg width="300" height="150" style="border:1px solid black">
  <defs>
    <radialGradient id="esfera" cx="50%" cy="50%" r="50%" fx="25%" fy="25%">
      <stop offset="0%"   stop-color="white" />
      <stop offset="100%" stop-color="royalblue" />
    </radialGradient>
  </defs>
  <defs>
    <radialGradient id="esfera2" cx="50%" cy="50%" r="50%" fx="75%" fy="25%">
      <stop offset="0%"   stop-color="white" />
      <stop offset="100%" stop-color="tomato" />
    </radialGradient>
  </defs>

  <circle cx="60" cy="75" r="60" fill="url(#esfera)" />
  <circle cx="180" cy="75" r="60" fill="url(#esfera2)" />
</svg>

<p>Padrões - Pattern</p>
<svg width="300" height="150" style="border:1px solid black">
  <defs>
    <pattern id="bolinhas" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="lightyellow" />
      <circle cx="10" cy="10" r="5" fill="tomato" />
    </pattern>
    <pattern id="listras" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="16" fill="royalblue" />
    </pattern>
  </defs>
  <rect x="10"  y="10" width="130" height="130" fill="url(#bolinhas)" />
  <rect x="160" y="10" width="130" height="130" fill="url(#listras)" stroke="black" />
</svg> 

<p>ClipPath</p>
<svg width="300" height="150" style="border:1px solid black">
  <defs>
    <clipPath id="recorte">
      <circle cx="150" cy="75" r="55" />
    </clipPath>
  </defs>

  <g clip-path="url(#recorte)">
    <rect x="0"   y="0" width="150" height="150" fill="tomato" />
    <rect x="150" y="0" width="150" height="150" fill="royalblue" />
  </g>
</svg>

<p>ClipPath 2</p>
<svg width="300" height="150" style="border:1px solid black">
  <defs>
    <clipPath id="recort">
      <circle cx="150" cy="50" r="25" />
	  <circle cx="150" cy="100" r="25" />
    </clipPath>
  </defs>

  <g clip-path="url(#recort)">
    <rect x="0"   y="0" width="150" height="150" fill="tomato" />
    <rect x="150" y="0" width="150" height="150" fill="royalblue" />
  </g>
</svg>

<p>Mask</p>
<svg width="300" height="150" style="border:1px solid black">
  <defs>
    <linearGradient id="fade">
      <stop offset="0%"   stop-color="white"/>
      <stop offset="100%"  stop-color="black"/>
    </linearGradient>
    <mask id="mascara">
      <rect width="300" height="150" fill="url(#fade)" />
    </mask>
  </defs>

  <rect width="300" height="150" fill="gold" />
  <rect width="300" height="150" fill="royalblue" mask="url(#mascara)" />
</svg>
