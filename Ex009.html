<p>Line</p>
<svg width="300" height="150" style="border:1px solid black">
  <line x1="20" y1="30" x2="200" y2="110" stroke="black" stroke-width="3" />
</svg>

<p>Horizontais e Verticais</p>
<svg width="300" height="150" style="border:1px solid black">
  <line x1="20" y1="40"  x2="280" y2="40"  stroke="red"  stroke-width="4" />
  <line x1="150" y1="60" x2="150" y2="130" stroke="blue" stroke-width="4" />
</svg>

<p>Pontas arredondadas</p>
<svg width="300" height="150" style="border:1px solid black">
  <line x1="40" y1="30"  x2="260" y2="30"  stroke="black" stroke-width="16" stroke-linecap="butt" />
  <line x1="40" y1="75"  x2="260" y2="75"  stroke="black" stroke-width="16" stroke-linecap="round" />
  <line x1="40" y1="120" x2="260" y2="120" stroke="black" stroke-width="16" stroke-linecap="square" />
</svg>

<p>Tracejado</p>
<svg width="300" height="150" style="border:1px solid black">
  <line x1="20" y1="40"  x2="280" y2="40"  stroke="black" stroke-width="3" stroke-dasharray="10 5" />
  <line x1="20" y1="75"  x2="280" y2="75"  stroke="black" stroke-width="3" stroke-dasharray="2 6" />
  <line x1="20" y1="110" x2="280" y2="110" stroke="black" stroke-width="3" stroke-dasharray="20 5 5 5" />
</svg>

<p>Grade e eixos</p>
<svg width="300" height="150" style="border:1px solid black">
  <rect x="0" y="0" width="300" height="150" fill="#f5f5f5" />
  <line x1="0" y1="50"  x2="300" y2="50"  stroke="lightgray" stroke-width="1" />
  <line x1="0" y1="100" x2="300" y2="100" stroke="lightgray" stroke-width="1" />
  <line x1="30" y1="10" x2="30"  y2="130" stroke="black" stroke-width="2" />
  <line x1="30" y1="130" x2="280" y2="130" stroke="black" stroke-width="2" />
  <circle cx="90"  cy="90" r="5" fill="red" />
  <circle cx="160" cy="60" r="5" fill="red" />
  <circle cx="240" cy="30" r="5" fill="red" />
</svg>

<p>Gráfico</p>
<svg width="300" height="150" style="border:1px solid black">
  <rect x="0" y="0" width="300" height="150" fill="#f5f5f5" />
  <line x1="20" y1="100"  x2="280" y2="50"  stroke="lightgray" stroke-width="1" />

  <line x1="30" y1="10" x2="30"  y2="130" stroke="black" stroke-width="2" />
  <line x1="30" y1="130" x2="280" y2="130" stroke="black" stroke-width="2" />
  <circle cx="90"  cy="90" r="5" fill="red" />
  <circle cx="160" cy="60" r="5" fill="red" />
  <circle cx="240" cy="30" r="5" fill="red" />
</svg>

<p>Retas</p>
<svg width="300" height="150" style="border:1px solid black">
  <!-- sobe: y diminui (100 -> 50) -->
  <line x1="20" y1="100" x2="280" y2="50" stroke="green" stroke-width="3" />

  <!-- desce: y aumenta (50 -> 100) -->
  <line x1="20" y1="50" x2="280" y2="100" stroke="red" stroke-width="3" />

  <!-- marcadores do ponto inicial de cada uma -->
  <circle cx="20" cy="100" r="5" fill="green" />
  <circle cx="20" cy="50"  r="5" fill="red" />
</svg>
